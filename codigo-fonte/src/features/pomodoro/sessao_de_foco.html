<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sessão de Foco Inteligente - Estudo Inteligente</title>
  
  <link rel="stylesheet" href="../../shared/css/global.css" />
  <link rel="stylesheet" href="sessao_de_foco.css" />
  <link rel="stylesheet" href="../../shared/css/accessibility.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Sons pré-carregados -->
  <audio id="focusStartSound" preload="auto" src="../../shared/assets/sounds/focus-start.mp3"></audio>
  <audio id="focusEndSound" preload="auto" src="../../shared/assets/sounds/focus-end.mp3"></audio>
  <audio id="breakStartSound" preload="auto" src="../../shared/assets/sounds/break-start.mp3"></audio>
  <audio id="breakEndSound" preload="auto" src="../../shared/assets/sounds/break-end.mp3"></audio>
</head>
<body>
  <aside class="sidebar">
    <a href="../dashboard/inicio.html" aria-label="Estudo Inteligente - Página Inicial">
      <img src="../../shared/assets/img/logoestudobranco.png" alt="" class="logo-sidebar" />
    </a>
  </aside>

  <main class="main">
    <header class="header">
      <div class="user-info">
        <span id="userName">Usuário</span>
        <button id="themeToggle" aria-label="Alternar tema claro e escuro">
          <i class="fas fa-moon" aria-hidden="true"></i>
          <span class="sr-only">Alternar tema</span>
        </button>
      </div>
    </header>

    <div class="content">
      <h1 class="page-title"><i class="fas fa-clock" aria-hidden="true"></i> Sessão de Foco</h1>

      <div class="focus-container">
        <section class="section task-selector" aria-labelledby="task-selector-heading">
          <h2 id="task-selector-heading"><i class="fas fa-tasks" aria-hidden="true"></i> Escolha as tarefas</h2>
          
          <div class="task-list" role="group" aria-label="Lista de tarefas para focar">
            <!-- Tarefas serão carregadas dinamicamente -->
          </div>
          
          <div class="selected-tasks-container">
            <div class="selected-tasks-header">
              <h3>Tarefas selecionadas</h3>
              <span class="selected-tasks-count" id="selectedTasksCount">0/8</span>
            </div>
            
            <div class="selected-tasks-list" id="selectedTasksList">
              <!-- Tarefas selecionadas aparecerão aqui -->
            </div>
            
            <div id="tasksValidation" class="time-validation" style="display: none;">
              Você precisa de pelo menos 2 horas (120 minutos) para selecionar 8 tarefas
            </div>
          </div>
        </section>

        <section class="section pomodoro-clock" aria-labelledby="pomodoro-heading">
          <h2 id="pomodoro-heading" class="sr-only">Contador Pomodoro</h2>
          
          <div class="timer-container">
            <div class="clock-circle" id="clock-circle">
              <div class="time-markers" id="time-markers"></div>
              <div class="clock-progress" id="clock-progress"></div>
              <div class="time-display" id="time-display">25:00</div>
              <div class="progress-percentage" id="progress-percentage"></div>
            </div>
          </div>

          <div class="timer-status">
            <div class="timer-mode-indicator focus" id="timerModeIndicator">
              <i class="fas fa-brain"></i> <span id="timerModeText">Modo Foco</span>
            </div>
            <div class="timer-next-session" id="nextSessionInfo">
              Próxima pausa em: 25:00
            </div>
          </div>

          <div class="windows-style-selector">
            <div class="selector-tabs">
              <button class="tab-btn active" data-tab="manual-tab">
                <i class="fas fa-hand-pointer"></i> Manual
              </button>
              <button class="tab-btn" data-tab="auto-tab">
                <i class="fas fa-robot"></i> Automático
              </button>
            </div>
            
            <div class="selector-content">
              <div id="manual-tab" class="tab-content active">
                <div class="time-input-group">
                  <label for="custom-time-input">
                    <i class="fas fa-clock"></i> Duração do Foco
                  </label>
                  <div class="time-input-container">
                    <input type="number" id="custom-time-input" min="15" max="240" value="25">
                    <span class="input-suffix">minutos</span>
                  </div>
                  <small class="hint">Digite um valor entre 15 e 240 minutos</small>
                </div>
              </div>
              
              <div id="auto-tab" class="tab-content">
                <div class="auto-settings-group">
                  <div class="form-row">
                    <label for="focus-time">
                      <i class="fas fa-brain"></i> Tempo de Foco
                    </label>
                    <div class="number-input">
                      <input type="number" id="focus-time" min="15" max="240" value="25">
                      <span class="input-suffix">min</span>
                    </div>
                  </div>
                  
                  <div class="form-row">
                    <label for="break-time">
                      <i class="fas fa-coffee"></i> Tempo de Pausa
                    </label>
                    <div class="number-input">
                      <input type="number" id="break-time" min="5" max="30" value="5">
                      <span class="input-suffix">min</span>
                    </div>
                  </div>
                  
                  <div class="form-row checkbox-row">
                    <input type="checkbox" id="use-pomodoro-ratio">
                    <label for="use-pomodoro-ratio">
                      Usar proporção Pomodoro padrão (1:5)
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="timer-controls">
            <button id="start-btn" class="btn-primary">
              <i class="fas fa-play" aria-hidden="true"></i> Iniciar
            </button>
            <button id="cancel-btn" class="btn-secondary">
              <i class="fas fa-stop" aria-hidden="true"></i> Cancelar
            </button>
          </div>
        </section>
      </div>
    </div>

    <footer>
      <p>Estudo Inteligente - &copy; <span id="currentYear"></span></p>
    </footer>
  </main>

  <script src="sessao_de_foco.js"></script>
  <script src="../../shared/js/menu.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/global-user.js"></script>
  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();
  </script>
</body>
</html>
