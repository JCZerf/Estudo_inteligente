<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudo Inteligente - Login</title>
  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <div class="login-container">
    <header class="left-side">
      <div class="logo-container">
        <img src="../../shared/assets/img/logoestudobranco.png" alt="Estudo Inteligente" class="logo">
      </div>
    </header>
    
    <main class="right-side">
      <div class="form-header">
        <h1>Bem-vindo de volta</h1>
        <p>Faça login para continuar</p>
      </div>
      
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-container">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-container password-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Digite sua senha" required>
            <button type="button" class="toggle-password" aria-label="Mostrar senha">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        
        <div id="error-message" class="error-message" role="alert"></div>
        
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me">
            <span>Lembrar de mim</span>
          </label>
          <a href="#" class="forgot-password">Esqueceu a senha?</a>
        </div>
        
        <button type="submit" class="btn btn-primary"
          <span class="btn-text"><a href="../dashboard/inicio.html">Entrar</a></span>
          <i class="fas fa-spinner fa-spin loading-icon"></i>
        </button>
        
        <div class="register-redirect">
          Não tem uma conta? <a href="cadastro.html" class="register-link">Crie uma conta</a>
        </div>
      </form>
    </main>
  </div>

  <footer>
    <p>Estudo Inteligente &copy; <span id="currentYear"></span></p>
  </footer>

  <script src="login.js"></script>
</body>
</html>
