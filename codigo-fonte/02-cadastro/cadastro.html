<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudo Inteligente - Login</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>

  <div class="background"></div>

  <div class="login-container">
    <div class="left-side"> 
      <img src="../img/logoestudobranco.png" alt="Logo Estudo Inteligente" class="logo">
      </div>
    <div class="right-side">
      <div class="toggle-buttons">
        <h1>Criar Conta</h1>
      </div>
      <form class="login-form">
        <label for="name">Nome Completo</label>
        <input type="text" id="nome" placeholder="Insira seu nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="exemple@email.com" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required>
        
        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="email" placeholder="Confirmar senha" required>

        <span class="error-message">A senha é obrigatória</span>

        <button type="submit" class="btn-criarconta">Criar conta</button>
          <div class="login-redirect">
            <a href="../01-login/login.html" class="login-redirect">Já tem uma conta? Entrar</a>
          </div>

      </form>
    </div>
  </div>
  <footer>Estudo Inteligente - 2025</footer>
</body>
</html>
