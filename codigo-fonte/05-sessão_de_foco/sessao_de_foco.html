<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sessão de Foco - Estudo Inteligente</title>
  <link rel="stylesheet" href="../style/global.css" />
  <link rel="stylesheet" href="sessao_de_foco.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <a href="../03-inicio/inicio.html">
      <img src="../img/logoestudobranco.png" alt="Estudo Inteligente" class="logo-sidebar" />
    </a>
    <nav>
      <a href="../04-inicio/inicio.html"><i class="fas fa-home"></i> Início</a>
      <a href="../05-sessão_de_foco/sessao_de_foco.html" class="active"><i class="fas fa-clock"></i> Sessão de Foco</a>
      <a href="../06-cronograma/cronograma.html"><i class="fas fa-calendar-alt"></i> Cronograma</a>
      <a href="../07-tarefas/tarefas.html"><i class="fas fa-tasks"></i> Tarefas</a>
      <a href="../08-ranking/ranking.html"><i class="fas fa-chart-line"></i> Ranking</a>
      <a href="../09-configurações/configuracoes.html"><i class="fas fa-cog"></i> Configurações</a>
      <a href="../10-guias/guias.html"><i class="fas fa-book"></i> Guias</a>
      <a href="../01-landing-page/index.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="header">
      <div class="user-info">
        <span>Usuário: Joaquim Silva</span>
        <button id="themeToggle" aria-label="Alternar tema">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>

    <div class="content">
      <h1><i class="fas fa-clock"></i> Sessão de Foco</h1>

      <div class="focus-container">
        <!-- Seção de Tarefas -->
        <div class="section task-selector">
          <h3><i class="fas fa-tasks"></i> Escolha a tarefa</h3>
          <div class="task-list">
            <button class="btn-task active" data-task="Matemática">
              <i class="fas fa-square-root-alt"></i> Estudar Matemática
            </button>
            <button class="btn-task" data-task="Programação">
              <i class="fas fa-code"></i> Estudar Programação
            </button>
            <button class="btn-task" data-task="Leitura">
              <i class="fas fa-book"></i> Fazer leitura técnica
            </button>
          </div>
          <div class="time-invested">
            <i class="fas fa-clock"></i> Tempo investido: <span>0</span> minutos
          </div>
        </div>

        <!-- Seção do Timer -->
        <div class="section pomodoro-clock">
          <div class="timer-display">
            <div id="clock-circle">25:00</div>
          </div>
          
          <div class="timer-controls">
            <button id="start-btn" class="btn-primary">
              <i class="fas fa-play"></i> Iniciar
            </button>
            <button id="cancel-btn" class="btn-secondary">
              <i class="fas fa-stop"></i> Cancelar
            </button>
          </div>

          <div class="time-options">
            <h3><i class="fas fa-cog"></i> Configurações do Timer</h3>
            <select id="tempo-select" class="form-select">
              <option value="25">25 minutos (Pomodoro)</option>
              <option value="30">30 minutos</option>
              <option value="45">45 minutos</option>
              <option value="60">60 minutos</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>Estudo Inteligente - <span id="currentYear"></span></p>
    </footer>
  </div>

  <script src="sessao_de_foco.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/theme.js"></script>
</body>
</html>
