<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudo Inteligente - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="background"></div>

  <div class="login-container">
    <div class="left-side">
      <img src="../img/logoestudobranco.png" alt="Logo Estudo Inteligente" class="logo">
    </div>
    <div class="right-side">
      <div class="toggle-buttons">
          <a href="../03-inicio/inicio.html">
            <button class="btn active"> Entrar</button>
          </a>
          <a>
            <a href="../02-cadastro/cadastro.html">
            <button class="btn">Criar conta</button>
          </a>  
      </div>
      <form class="login-form">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="E-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Senha" required>

        <span class="error-message">A senha é obrigatória</span>

        <a href="../03-inicio/inicio.html" class="btn-login-link">Entrar</a>
         
        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </form>
    </div>
  </div>
  <footer>Estudo Inteligente - 2025</footer>
</body>
</html>
